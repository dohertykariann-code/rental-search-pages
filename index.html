function saveFavs() { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }
function saveArchs() { localStorage.setItem(ARCH_KEY, JSON.stringify([...archs])); }

function otd(listing) {
  const isUtilIncl = listing.notes.includes('ALL UTILITIES INCLUDED');
  return isUtilIncl ? listing.rent : listing.rent + 260;
}

function badge(listing) {
  let s = '';
  if (listing.source === 'CL')  s += '<span class="badge badge-cl">CL</span>';
  if (['WEB','Zillow','HotPads','ForRent','RentCafe','Property','Apartments.com','RentalSource','Craigslist','Facebook'].includes(listing.source)) {
    s += `<span class="badge badge-web">${listing.source}</span>`;
  }
  if (listing.notes.includes('INCOME RESTRICTED')) s += '<span class="badge badge-income">INCOME RESTRICTED</span>';
  if (listing.notes.includes('ALL UTILITIES INCLUDED')) s += '<span class="badge badge-utils">UTILS INCL</span>';
  if (listing.rent <= 2500 && listing.baths >= 2) s += '<span class="badge badge-fit">TARGET FIT</span>';
  if (listing.rent > 2500 && listing.rent <= 2650 && listing.baths >= 2) s += '<span class="badge badge-stretch">STRETCH</span>';
  if (listing.baths < 2) s += '<span class="badge badge-miss">BATH NEAR MISS</span>';
  if (listing.rent > 2650) s += '<span class="badge badge-ref">REFERENCE</span>';
  return s;
}

function makeRow(listing) {
  const fav  = favs.has(listing.id);
  const arch = archs.has(listing.id);
  const eff  = otd(listing);
  const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(listing.address)}`;

  let addrHtml = listing.url
    ? `<a class="primary-listing" href="${listing.url}">${listing.address}</a>`
    : listing.address;
  addrHtml += ` <a href="${mapsUrl}" class="listing">map ↗</a>`;
  addrHtml += badge(listing);

  const sqftStr = listing.sqft ? listing.sqft.toLocaleString() : '—';
  const bathsStr = listing.baths ? listing.baths : '?';
  const typeShort = listing.type === 'Single Family' ? 'House' : listing.type === 'Apartment' ? 'Apt' : listing.type;
  const notesClean = listing.notes
    .replace('ALL UTILITIES INCLUDED', '').replace('INCOME RESTRICTED 60% AMI', '').trim()
    .replace(/^·\s*/, '').replace(/\s*·\s*$/, '');

  const tr = document.createElement('tr');
  tr.dataset.id = listing.id;
  if (arch) tr.classList.add('archived');
  if (fav) tr.classList.add('favorited');

  tr.innerHTML = `
    <td><button class="btn-fav ${fav ? 'active' : 'inactive'}" onclick="toggleFav('${listing.id}')" title="Favorite">${fav ? '♥' : '♡'}</button></td>
    <td><button class="btn-arch" onclick="toggleArch('${listing.id}')" title="Archive / dismiss">✕</button></td>
    <td class="rent">$${listing.rent.toLocaleString()}</td>
    <td class="otd">$${eff.toLocaleString()}</td>
    <td class="beds">${listing.beds}br/${bathsStr}ba</td>
    <td>${sqftStr}</td>
    <td class="dist">${listing.psu}</td>
    <td class="dist">${listing.sj}</td>
    <td>${typeShort}</td>
    <td class="addr" onclick="openListing('${listing.id}', event)">${addrHtml}</td>
    <td class="note">${notesClean}</td>`;
  return tr;
}

function openListing(id, event) {
  if (event.target.closest('a, button')) return;
  const listing = LISTINGS.find(l => l.id === id);
  if (listing && listing.url) window.location.href = listing.url;
}

  const favThead = document.getElementById('fav-thead');
  const activeSections = document.getElementById('active-sections');
  const archBody = document.getElementById('arch-body');
  const archSec  = document.getElementById('arch-section');

  activeSections.innerHTML = '';
  archBody.innerHTML = '';

  const favorites = LISTINGS.filter(l => favs.has(l.id) && !archs.has(l.id));
  const active    = LISTINGS.filter(l => !favs.has(l.id) && !archs.has(l.id));
  const archived  = LISTINGS.filter(l => archs.has(l.id));

  // Favorites block
  if (favorites.length) {
    favHead.classList.add('visible');
    favThead.style.display = '';
    favorites.forEach(l => favBody.appendChild(makeRow(l)));

    favThead.style.display = 'none';

  const hoods = HOOD_ORDER.filter(h => active.some(l => l.neighborhood === h));

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = hood;
    div.appendChild(label);

    const thead = document.createElement('thead');
    thead.innerHTML = `<tr>
      <th></th><th></th><th>Rent</th><th>OTD est</th><th>Bed/Ba</th><th>Sqft</th>
      <th>≈mi PSU</th><th>≈mi HMC</th><th>Type</th><th>Address</th><th>Notes</th>
    </tr>`;
    tbl.appendChild(thead);

    const tbody = document.createElement('tbody');
    active.filter(l => l.neighborhood === hood)
          .sort((a,b) => a.rent - b.rent)
          .forEach(l => tbody.appendChild(makeRow(l)));
    tbl.appendChild(tbody);
    div.appendChild(tbl);
    activeSections.appendChild(div);
  });

  // Archived block
  if (archived.length) {
    archSec.style.display = '';
    archived.forEach(l => {
      const tr = makeRow(l);
      tr.classList.add('archived');
      if (showingArchived) tr.classList.add('show-archived');
      archBody.appendChild(tr);
    });
  } else {
    archSec.style.display = 'none';
  }

  // Count
  const total = LISTINGS.length;
  const shown = favorites.length + active.length;
  document.getElementById('count-line').textContent =
    `${shown} of ${total} listings · ${favorites.length} favorite${favorites.length !== 1 ? 's' : ''} · ${archived.length} archived`;

  document.getElementById('arch-btn').textContent = showingArchived
    ? 'Hide archived' : `Show archived (${archived.length})`;
}

function toggleFav(id) {
  if (favs.has(id)) { favs.delete(id); } else { favs.add(id); archs.delete(id); }
  saveFavs(); saveArchs(); render();
}
function toggleArch(id) {
  if (archs.has(id)) { archs.delete(id); } else { archs.add(id); favs.delete(id); }
  saveFavs(); saveArchs(); render();
}
function toggleArchived() {
  showingArchived = !showingArchived;
  document.querySelectorAll('.archived').forEach(tr => {
    if (showingArchived) tr.classList.add('show-archived');
    else tr.classList.remove('show-archived');
  });
  document.getElementById('arch-btn').textContent = showingArchived
    ? 'Hide archived' : `Show archived (${[...archs].length})`;
}

render();
</script>
</body>
</html>
